name: focus_wellbeing_app
description: App de productividad, bienestar digital, time-blocking e IA ética.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Arquitectura y Gestión de Estado
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

  # Persistencia Local y Cifrado
  flutter_secure_storage: ^11.2.0
  sqlite3: ^3.7.1
  path: ^1.9.1

  # Sincronización y Red
  googleapis: ^17.0.0
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  http: ^1.2.0

  # Notificaciones y Segundo Plano
  flutter_local_notifications: ^22.3.2
  workmanager: ^0.10.10

  # Iconos
  cupertino_icons: ^2.0.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.3


hooks:
  user_defines:
    sqlite3:
      source: sqlcipher