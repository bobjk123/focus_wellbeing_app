name: focus_wellbeing_app
description: App de productividad, bienestar digital, time-blocking e IA ética.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Arquitectura y Gestión de Estado
  flutter_bloc: ^8.1.3
  get_it: ^7.6.7

  # Persistencia Local y Cifrado
  flutter_secure_storage: ^9.0.0
  sqlite3: ^3.7.1
  path: ^1.9.1

  # Sincronización y Red
  googleapis: ^13.1.0
  google_sign_in: ^6.2.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.1
  http: ^1.2.0

  # Notificaciones y Segundo Plano
  flutter_local_notifications: ^17.1.2
  workmanager: ^0.5.2

  # Iconos
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Testing
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

# SOLUCIÓN: Sobrescribir las restricciones transitivas en conflicto
dependency_overrides:
  analyzer: ^6.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher